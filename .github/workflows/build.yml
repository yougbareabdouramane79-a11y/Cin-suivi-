name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o Cinesuivi.zip
          rm Cinesuivi.zip
          if [ -d "Cinesuivi" ]; then mv Cinesuivi/*.; mv Cinesuivi/.*. 2>/dev/null || true; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x gradlew
      - run:./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cinesuivi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
